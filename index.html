<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>四象限任务管理</title>
  <link rel="stylesheet" href="css/style.css">

  <!--
    防闪白：必须赶在第一次绘制之前把主题挂上去。

    等 body 末尾的 JS 跑完再切主题的话，暗色主题的用户会先看到一下白底、
    再闪成暗的 —— 网络慢的时候这一下很明显。

    ⚠️ 这是 DS 1.7 规矩一（数据只能通过 store.js 读写）的**唯一一处例外**。
    约束是死的：**只读**、**只读主题这一个 key**、**绝不写任何东西**。
    少任何一条都不成立 —— 读用户数据、或者在这里写东西，都不行。

    改 config.js 里的 quadrant_ui_theme 这个名字时，这里要跟着改（两处有注释互指）。
  -->
  <script>
    (function () {
      try {
        if (window.localStorage.getItem('quadrant_ui_theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // 读不到就用亮色，不影响任何别的东西
      }
    })();
  </script>
</head>
<body>

  <!-- 保护模式提示条：数据读不出来时才显示（见 DS 2.4） -->
  <div id="banner" class="banner" hidden></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar__date">
      <button type="button" id="btn-prev-day" class="btn btn--icon" aria-label="前一天">‹</button>
      <input type="date" id="date-picker" class="date-picker" aria-label="选择日期">
      <button type="button" id="btn-next-day" class="btn btn--icon" aria-label="后一天">›</button>
      <button type="button" id="btn-today" class="btn btn--ghost">今天</button>
      <!-- 时间视图切换（见 DS 2.13）：四象限 ⇄ 按时段分组看当天 -->
      <button type="button" id="btn-view-toggle" class="btn btn--ghost">时间视图</button>
    </div>

    <div class="topbar__stats" id="stats" aria-live="polite">
      <span class="stat"><b id="stat-done">0</b> 已完成</span>
      <span class="stat"><b id="stat-total">0</b> 总数</span>
      <span class="stat">完成率 <b id="stat-rate">—</b></span>
    </div>

    <div class="topbar__actions">
      <button type="button" id="btn-theme" class="btn btn--icon" aria-label="切换主题">◐</button>
      <button type="button" id="btn-import" class="btn btn--ghost">导入</button>

      <span class="menu-anchor">
        <button type="button" id="btn-export" class="btn btn--ghost"
                aria-haspopup="true" aria-expanded="false">导出</button>
        <div id="export-menu" class="menu" hidden>
          <button type="button" class="menu__item" data-format="json">
            JSON<small>唯一能再导入回来的格式</small>
          </button>
          <button type="button" class="menu__item" data-format="md">
            Markdown<small>按日期排好的文本</small>
          </button>
          <button type="button" class="menu__item" data-format="zip">
            ZIP<small>JSON + Markdown 打包</small>
          </button>
          <!-- 安卓 App 里这一项会被 app.js 隐藏：那边的 window.print() 是空壳，
               留着就是一个点了没反应的按钮（见 DS 4.4） -->
          <button type="button" class="menu__item" data-format="pdf" id="menu-pdf">
            PDF<small>弹出打印对话框，自己另存为 PDF</small>
          </button>
        </div>
      </span>
    </div>
  </header>

  <!-- 选文件用的，藏起来由「导入」按钮触发 -->
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <!-- 四象限 -->
  <main id="quadrants" class="quadrants"></main>

  <!-- 计划池：推迟进来的任务在这里等安排，跟日期无关（见 DS 2.11） -->
  <section id="pool" class="pool"></section>

  <!-- 时间视图：按完成时段分组的当天任务（见 DS 2.13），默认藏着 -->
  <section id="timeview" class="timeview" hidden></section>

  <!-- 模板：把某一天的四象限存成能反复用的底稿（见 DS 2.14） -->
  <section id="templates" class="templates"></section>

  <!-- 提示统一出口（见 DS 4.3） -->
  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <!--
    脚本加载顺序不能乱（见 DS 1.4）：被依赖的排在前面。
    后面几步的文件还没写，写到哪个加哪个 —— 加的时候按这个顺序插到正确位置。
  -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/prefs.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/render.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/task-ops.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/date-nav.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
